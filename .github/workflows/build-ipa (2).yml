name: Build Switch IPA (NX2Apple - Soporta XCI y NSP)

on:
  workflow_dispatch:
    inputs:
      base_game_url:
        description: 'URL de tu juego base (.xci o .nsp)'
        required: true
        type: string
      update_nsp_url:
        description: 'URL del Update (.nsp o .xci) requerido (opcional si ya viene en el XCI)'
        required: false
        type: string
      keys_url:
        description: 'URL de tu archivo prod.keys'
        required: true
        type: string

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: 1. Clonar repositorio NX2Apple
        uses: actions/checkout@v4

      - name: 2. Instalar dependencias y parchar compatibilidad (Xcode 16 + RomFS Case-Insensitive)
        run: |
          export LC_ALL=C
          export LANG=C

          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE" || true
          fi

          # 1) Parchar compatibilidad Xcode 16 (.glassProminent -> .borderedProminent, apple-a18 -> apple-a17)
          # 2) Parchar romfs_arc.c para que la busqueda en romfs.idx sea insensible a mayusculas/minusculas (strcasecmp)
          python3 - << 'EOF'
          import os, re

          for root_dir in ("dm", "scripts"):
              if not os.path.exists(root_dir):
                  continue
              for dirpath, _, filenames in os.walk(root_dir):
                  for fn in filenames:
                      if fn.endswith((".swift", ".c", ".m", ".h", ".sh", ".py", ".yml", ".yaml", "Makefile", ".mk", ".pbxproj")):
                          p = os.path.join(dirpath, fn)
                          try:
                              txt = open(p, "r", encoding="utf-8", errors="ignore").read()
                          except Exception:
                              continue
                          new_txt = (
                              txt.replace(".glassProminent", ".borderedProminent")
                                 .replace(".buttonStyle(.glass)", ".buttonStyle(.bordered)")
                                 .replace("apple-a18", "apple-a17")
                                 .replace("apple-m4", "apple-m2")
                          )
                          if new_txt != txt:
                              open(p, "w", encoding="utf-8").write(new_txt)
                              print(f"Parchado para Xcode 16: {p}")

          # Hacer que romfs_arc.py ordene y guarde rutas normalizadas y que romfs_arc.c soporte busqueda insensible a mayusculas
          arc_c = "dm/host/romfs_arc.c"
          if os.path.exists(arc_c):
              code = open(arc_c, "r", encoding="utf-8", errors="ignore").read()
              print("=== Contenido original de romfs_arc.c (funciones de busqueda) ===")
              print(code[:4000])
              # Reemplazar strcmp por strcasecmp en la busqueda de rutas del archivo romfs.idx
              if "strcmp(" in code:
                  patched = "#include <strings.h>\n" + code.replace("strcmp(", "strcasecmp(")
                  open(arc_c, "w", encoding="utf-8").write(patched)
                  print("Parchado dm/host/romfs_arc.c: strcmp -> strcasecmp (Case-Insensitive RomFS Archive)")
          EOF

          brew install xcodegen zstd spirv-cross python@3.12
          brew install --cask dotnet-sdk
          sudo xcodebuild -license accept || true
          sudo xcodebuild -runFirstLaunch || true

          export DOTNET_ROOT="/usr/local/share/dotnet"
          sudo ln -sf /usr/local/share/dotnet /opt/homebrew/share/dotnet || true
          export PATH="/opt/homebrew/opt/python@3.12/libexec/bin:/usr/local/share/dotnet:/opt/homebrew/bin:$PATH"

          /opt/homebrew/opt/python@3.12/libexec/bin/python3 -m pip install --break-system-packages lz4 capstone fonttools backports.zstd
          python3 -m pip install --break-system-packages lz4 capstone fonttools || true
          python3 -m pip install --break-system-packages backports.zstd || true
          /usr/bin/python3 -m pip install --user lz4 capstone fonttools backports.zstd || true

          git clone https://github.com/tiliarou/4NXCI.git "$RUNNER_TEMP/4nxci_src" || git clone https://github.com/tetj/4NXCI-2026.git "$RUNNER_TEMP/4nxci_src"
          cd "$RUNNER_TEMP/4nxci_src"
          cp config.mk.template config.mk
          make CC=clang CFLAGS="-O2 -Wno-error -Wno-deprecated-declarations -Wno-implicit-function-declaration -Wno-int-conversion" -j4 || make CC=clang -j4

      - name: 3. Descargar prod.keys y convertir juego (.xci / .nsp)
        env:
          RAW_BASE_URL: ${{ inputs.base_game_url }}
          RAW_UPDATE_URL: ${{ inputs.update_nsp_url }}
          RAW_KEYS_URL: ${{ inputs.keys_url }}
        run: |
          export LC_ALL=C
          export LANG=C
          export PATH="/opt/homebrew/opt/python@3.12/libexec/bin:/usr/local/share/dotnet:/opt/homebrew/bin:$PATH"

          BASE_URL=$(python3 -c 'import os; u=os.environ.get("RAW_BASE_URL","").strip(); print(u.replace("/blob/","/resolve/"))')
          UPDATE_URL=$(python3 -c 'import os; u=os.environ.get("RAW_UPDATE_URL","").strip(); print(u.replace("/blob/","/resolve/"))')
          KEYS_URL=$(python3 -c 'import os; u=os.environ.get("RAW_KEYS_URL","").strip(); print(u.replace("/blob/","/resolve/"))')

          mkdir -p "$RUNNER_TEMP/keys" "$RUNNER_TEMP/raw" "$RUNNER_TEMP/game" "$RUNNER_TEMP/out_plain_romfs" ~/.switch
          curl -L --fail --retry 3 "$KEYS_URL" -o "$RUNNER_TEMP/keys/prod.keys"

          python3 - "$RUNNER_TEMP/keys/prod.keys" << 'EOF'
          import sys
          p = sys.argv[1]
          data = open(p, "rb").read()
          if b"<html" in data[:512].lower() or b"<!doctype" in data[:512].lower():
              sys.exit("ERROR: El enlace de prod.keys descargo una pagina HTML en vez del archivo.")
          lines = data.replace(b"\r\n", b"\n").splitlines()
          clean = [l.strip() for l in lines if l.strip() and b"master_kek_source_" not in l]
          open(p, "wb").write(b"\n".join(clean) + b"\n")
          print(f"prod.keys listo ({len(clean)} claves validas).")
          EOF

          cp "$RUNNER_TEMP/keys/prod.keys" ~/.switch/prod.keys
          cp "$RUNNER_TEMP/keys/prod.keys" "$RUNNER_TEMP/4nxci_src/keys.dat"

          curl -L --fail --retry 3 "$BASE_URL" -o "$RUNNER_TEMP/raw/base_download"

          FMT=$(python3 - "$RUNNER_TEMP/raw/base_download" << 'EOF'
          import sys
          f = open(sys.argv[1], "rb")
          head = f.read(512)
          if b"<html" in head.lower() or b"<!doctype" in head.lower():
              sys.exit("ERROR: El enlace del juego descargo una pagina HTML en vez del archivo.")
          print("NSP" if head[:4] == b"PFS0" else "XCI")
          EOF
          )

          if [ "$FMT" = "NSP" ]; then
            mv "$RUNNER_TEMP/raw/base_download" "$RUNNER_TEMP/game/base.nsp"
          else
            mv "$RUNNER_TEMP/raw/base_download" "$RUNNER_TEMP/raw/base.xci"
            mkdir -p "$RUNNER_TEMP/raw/tmp_xci"
            if "$RUNNER_TEMP/4nxci_src/4nxci" -k "$RUNNER_TEMP/keys/prod.keys" -o "$RUNNER_TEMP/game" -t "$RUNNER_TEMP/raw/tmp_xci" "$RUNNER_TEMP/raw/base.xci"; then
              find "$RUNNER_TEMP/game" -mindepth 2 -name "*.nsp" -exec mv {} "$RUNNER_TEMP/game/" \; || true
              rm -rf "$RUNNER_TEMP/raw/base.xci" "$RUNNER_TEMP/raw/tmp_xci"
            else
              rm -rf "$RUNNER_TEMP/raw/tmp_xci"
              mv "$RUNNER_TEMP/raw/base.xci" "$RUNNER_TEMP/game/base.xci"
            fi
          fi

          if [ -n "$UPDATE_URL" ]; then
            curl -L --fail --retry 3 "$UPDATE_URL" -o "$RUNNER_TEMP/raw/update_download"
            UFMT=$(python3 -c "import sys; h=open(sys.argv[1],'rb').read(4); print('NSP' if h==b'PFS0' else 'XCI')" "$RUNNER_TEMP/raw/update_download")
            if [ "$UFMT" = "NSP" ]; then
              mv "$RUNNER_TEMP/raw/update_download" "$RUNNER_TEMP/game/update.nsp"
            else
              mv "$RUNNER_TEMP/raw/update_download" "$RUNNER_TEMP/raw/update.xci"
              mkdir -p "$RUNNER_TEMP/raw/tmp_uxci"
              "$RUNNER_TEMP/4nxci_src/4nxci" -k "$RUNNER_TEMP/keys/prod.keys" -o "$RUNNER_TEMP/game" -t "$RUNNER_TEMP/raw/tmp_uxci" "$RUNNER_TEMP/raw/update.xci" || mv "$RUNNER_TEMP/raw/update.xci" "$RUNNER_TEMP/game/update.xci"
              find "$RUNNER_TEMP/game" -mindepth 2 -name "*.nsp" -exec mv {} "$RUNNER_TEMP/game/" \; || true
              rm -rf "$RUNNER_TEMP/raw/update.xci" "$RUNNER_TEMP/raw/tmp_uxci"
            fi
          fi

          rm -rf "$RUNNER_TEMP/raw"
          ls -lh "$RUNNER_TEMP/game"

      - name: 4. Ejecutar NX2Apple (Extraer, Reescribir ARM64, Shaders Metal y crear Slim IPA)
        run: |
          export LC_ALL=C
          export LANG=C
          export DOTNET_ROOT="/usr/local/share/dotnet"
          export PATH="/opt/homebrew/opt/python@3.12/libexec/bin:/usr/local/share/dotnet:/opt/homebrew/bin:$PATH"

          python3 scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/game" -k "$RUNNER_TEMP/keys/prod.keys"

          rm -f "$RUNNER_TEMP/game"/*.nsp "$RUNNER_TEMP/game"/*.xci || true

      - name: 5. Preparar RomFS directo (sin fragmentar) e IPA parchado
        run: |
          export LC_ALL=C
          export LANG=C
          mkdir -p "$RUNNER_TEMP/out_ipa"
          find "$RUNNER_TEMP/game" -name "*.ipa" -exec mv {} "$RUNNER_TEMP/out_ipa/" \;

          ROMFS_DIR=$(python3 - "$RUNNER_TEMP/game" << 'EOF'
          import os, sys
          root = sys.argv[1]
          candidates = []
          for dirpath, dirnames, filenames in os.walk(root):
              base = os.path.basename(dirpath).lower()
              if base in ("romfs", "rom", "content") and (dirnames or filenames):
                  candidates.append(dirpath)
          if candidates:
              candidates.sort(key=lambda p: len(p))
              print(candidates[0])
              sys.exit(0)
          for dirpath, dirnames, filenames in os.walk(root):
              if os.path.basename(os.path.dirname(dirpath)) == "extract" and len(dirnames) > 0:
                  print(dirpath)
                  sys.exit(0)
          print("")
          EOF
          )
          echo "Carpeta RomFS nativa localizada en: $ROMFS_DIR"
          ls -la "$ROMFS_DIR"
          mv "$ROMFS_DIR" "$RUNNER_TEMP/out_plain_romfs/romfs"

      - name: 6. Subir IPA ligero parchado (Case-Insensitive)
        uses: actions/upload-artifact@v4
        with:
          name: Switch-Game-Slim-IPA
          path: ${{ runner.temp }}/out_ipa/*.ipa
          retention-days: 5

      - name: 7. Subir carpeta RomFS nativa (sin fragmentar, modo upstream)
        uses: actions/upload-artifact@v4
        with:
          name: Switch-Game-Plain-RomFS
          path: ${{ runner.temp }}/out_plain_romfs/romfs/**
          retention-days: 5
