name: Build Switch IPA (NX2Apple - Soporta XCI y NSP)

on:
  workflow_dispatch:
    inputs:
      base_game_url:
        description: 'URL de descarga directa de tu juego base (.xci o .nsp)'
        required: true
        type: string
      update_nsp_url:
        description: 'URL de descarga directa del Update (.nsp o .xci) requerido (opcional si ya viene en el XCI)'
        required: false
        type: string
      keys_url:
        description: 'URL de descarga directa de tu archivo prod.keys'
        required: true
        type: string

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Clonar repositorio NX2Apple
        uses: actions/checkout@v4

      - name: Instalar dependencias (Homebrew, .NET, Python y 4NXCI)
        run: |
          brew install xcodegen zstd spirv-cross
          brew install --cask dotnet-sdk
          xcodebuild -downloadComponent MetalToolchain || true
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 capstone fonttools backports.zstd

          # Compilar 4NXCI para convertir archivos .xci a .nsp automaticamente
          git clone https://github.com/tetj/4NXCI-2026.git "$RUNNER_TEMP/4nxci_src" || git clone https://github.com/tiliarou/4NXCI.git "$RUNNER_TEMP/4nxci_src"
          cd "$RUNNER_TEMP/4nxci_src"
          cp config.mk.template config.mk
          make -j4

      - name: Descargar prod.keys y juego (.xci o .nsp)
        env:
          BASE_URL: ${{ inputs.base_game_url }}
          UPDATE_URL: ${{ inputs.update_nsp_url }}
          KEYS_URL: ${{ inputs.keys_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys" "$RUNNER_TEMP/raw" "$RUNNER_TEMP/game" "$RUNNER_TEMP/out_romfs/romfs" ~/.switch
          curl -L --fail "$KEYS_URL" -o "$RUNNER_TEMP/keys/prod.keys"
          # Limpiar posibles lineas corruptas que bloquean nx_extract o 4nxci
          sed -i '' '/master_kek_source_/d' "$RUNNER_TEMP/keys/prod.keys" || true
          cp "$RUNNER_TEMP/keys/prod.keys" ~/.switch/prod.keys
          cp "$RUNNER_TEMP/keys/prod.keys" "$RUNNER_TEMP/4nxci_src/keys.dat"

          echo "Descargando archivo principal del juego..."
          curl -L --fail "$BASE_URL" -o "$RUNNER_TEMP/raw/base_download"

          # Detectar automaticamente si el archivo descargado es NSP (empieza con PFS0) o XCI
          MAGIC=$(head -c 4 "$RUNNER_TEMP/raw/base_download" | tr -d '\0')
          if [ "$MAGIC" = "PFS0" ]; then
            echo "Archivo detectado como NSP directo."
            mv "$RUNNER_TEMP/raw/base_download" "$RUNNER_TEMP/game/base.nsp"
          else
            echo "Archivo detectado como XCI. Convirtiendo a NSP con 4NXCI..."
            mv "$RUNNER_TEMP/raw/base_download" "$RUNNER_TEMP/raw/base.xci"
            "$RUNNER_TEMP/4nxci_src/4nxci" -k "$RUNNER_TEMP/keys/prod.keys" -o "$RUNNER_TEMP/game" -t "$RUNNER_TEMP/raw/tmp_xci" "$RUNNER_TEMP/raw/base.xci"
            rm -rf "$RUNNER_TEMP/raw/base.xci" "$RUNNER_TEMP/raw/tmp_xci"
          fi

          if [ -n "$UPDATE_URL" ]; then
            echo "Descargando archivo de actualizacion (Update)..."
            curl -L --fail "$UPDATE_URL" -o "$RUNNER_TEMP/raw/update_download"
            UMAGIC=$(head -c 4 "$RUNNER_TEMP/raw/update_download" | tr -d '\0')
            if [ "$UMAGIC" = "PFS0" ]; then
              mv "$RUNNER_TEMP/raw/update_download" "$RUNNER_TEMP/game/update.nsp"
            else
              mv "$RUNNER_TEMP/raw/update_download" "$RUNNER_TEMP/raw/update.xci"
              "$RUNNER_TEMP/4nxci_src/4nxci" -k "$RUNNER_TEMP/keys/prod.keys" -o "$RUNNER_TEMP/game" -t "$RUNNER_TEMP/raw/tmp_uxci" "$RUNNER_TEMP/raw/update.xci"
              rm -rf "$RUNNER_TEMP/raw/update.xci" "$RUNNER_TEMP/raw/tmp_uxci"
            fi
          fi

          echo "Archivos NSP listos para NX2Apple:"
          ls -lh "$RUNNER_TEMP/game"

      - name: Ejecutar pipeline de NX2Apple (Unpack, Rewrite, Shaders, Slim IPA)
        run: |
          export DOTNET_ROOT="/usr/local/share/dotnet"
          export PATH="$DOTNET_ROOT:$PATH"
          python3 scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/game" -k "$RUNNER_TEMP/keys/prod.keys"

      - name: Empaquetar y verificar el archivo fragmentado RomFS (200 MiB shards)
        run: |
          ROMFS_DIR=$(find "$RUNNER_TEMP/game" -type d \( -name "romfs" -o -name "RomFS" \) | head -n 1)
          if [ -z "$ROMFS_DIR" ]; then
            ROMFS_DIR=$(find "$RUNNER_TEMP/game" -type d -name "*-work" | head -n 1)/romfs
          fi
          echo "Empaquetando RomFS desde: $ROMFS_DIR"
          python3 dm/tools/romfs_arc.py pack "$ROMFS_DIR" "$RUNNER_TEMP/out_romfs/romfs/romfs" --shard-mib 200
          python3 dm/tools/romfs_arc.py verify "$RUNNER_TEMP/out_romfs/romfs/romfs" "$ROMFS_DIR"

      - name: Recolectar archivo IPA generado
        run: |
          mkdir -p "$RUNNER_TEMP/out_ipa"
          find "$RUNNER_TEMP/game" -name "*.ipa" -exec cp {} "$RUNNER_TEMP/out_ipa/" \;
          ls -lh "$RUNNER_TEMP/out_ipa" "$RUNNER_TEMP/out_romfs/romfs"

      - name: Subir IPA ligero listo para instalar
        uses: actions/upload-artifact@v4
        with:
          name: Switch-Game-Slim-IPA
          path: ${{ runner.temp }}/out_ipa/*.ipa
          retention-days: 5

      - name: Subir fragmentos RomFS (carpeta romfs/)
        uses: actions/upload-artifact@v4
        with:
          name: Switch-Game-RomFS-Shards
          path: ${{ runner.temp }}/out_romfs/romfs/*
          retention-days: 5
